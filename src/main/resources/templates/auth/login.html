<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Sign In')}"></head>
<body class="bg-vault-black text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

<div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 items-center justify-center text-slate-950 font-black text-2xl shadow-xl shadow-emerald-500/25 mb-4">
            TV
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Trust<span class="text-emerald-400">Vault</span></h1>
        <p class="text-sm text-vault-muted mt-1">Zero-Trust Confidential Document Management</p>
    </div>

    <!-- Login Card -->
    <div class="bg-vault-card border border-vault-border rounded-2xl p-8 shadow-2xl backdrop-blur-xl">
        <h2 class="text-xl font-bold text-white mb-6">Sign In to Your Vault</h2>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-vault-muted mb-2">Username or Email</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required autofocus
                           placeholder="Enter your username"
                           class="w-full px-4 py-3 rounded-xl bg-vault-dark border border-vault-border text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition-all">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-vault-muted">Password</label>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••••••"
                           class="w-full px-4 py-3 rounded-xl bg-vault-dark border border-vault-border text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition-all">
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-sm transition duration-200 shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2">
                <span>Access Secure Vault</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-vault-border text-center">
            <p class="text-sm text-vault-muted">
                Need an account?
                <a href="/register" class="text-emerald-400 hover:text-emerald-300 font-semibold transition-colors">Register</a>
            </p>
        </div>
    </div>

    <!-- Security Indicator -->
    <div class="mt-8 text-center flex items-center justify-center space-x-2 text-xs text-vault-muted">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>End-to-end cryptographic audit trail & private cloud storage</span>
    </div>
</div>

</body>
</html>
